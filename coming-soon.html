<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>CENOFEX | Coming Soon</title>
  <meta name="description" content="CENOFEX — Your Outsourced Center of Excellence. Our new website is coming soon.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="CENOFEX | Coming Soon">
  <meta property="og:description" content="Your Outsourced Center of Excellence. Our new website is coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/logo-white-text.png">
  <link rel="icon" type="image/png" href="images/brand-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#02A78E;--teal:#048282;--ink:#0c1615;--line:rgba(255,255,255,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;
      font-family:Manrope,Arial,sans-serif;color:#fff;text-align:center;
      background:radial-gradient(900px 520px at 50% -10%,rgba(2,167,142,.22),transparent 62%),var(--ink)}
    /* фирменный паттерн — очень деликатно */
    body::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:url('images/pattern-light.png') 0 0 repeat;background-size:190px auto;opacity:.05}
    /* фирменный знак, медленно вращается */
    body::after{content:"";position:absolute;right:-8%;bottom:-14%;width:min(60vw,560px);height:min(60vw,560px);
      background:url('images/brand-icon.png') center/contain no-repeat;opacity:.06;pointer-events:none;
      animation:spin 50s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .wrap{position:relative;z-index:1;padding:40px 22px;max-width:660px}
    .logo{width:min(300px,72vw);margin:0 auto 40px;display:block}
    .badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
      color:var(--green);border:1px solid rgba(2,167,142,.45);border-radius:999px;padding:8px 16px;margin-bottom:22px}
    h1{font-size:clamp(34px,7vw,62px);line-height:1.05;letter-spacing:-.02em;margin:0 0 18px;font-weight:800}
    h1 span{background:linear-gradient(120deg,#02A78E,#048282);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{font-size:clamp(16px,2.2vw,19px);line-height:1.6;color:rgba(255,255,255,.72);margin:0 auto 34px;max-width:520px}
    .mail{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;
      background:linear-gradient(120deg,#02A78E,#048282);color:#fff;font-weight:800;text-decoration:none;
      box-shadow:0 14px 34px rgba(2,167,142,.28);transition:transform .2s,box-shadow .2s}
    .mail:hover{transform:translateY(-2px);box-shadow:0 20px 42px rgba(2,167,142,.36)}
    .meta{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);
      font-size:13px;color:rgba(255,255,255,.5);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    @media (prefers-reduced-motion:reduce){body::after{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="images/logo-white-text.png" alt="CENOFEX">
    <span class="badge">Coming Soon</span>
    <h1>Your Outsourced <span>Center of Excellence.</span></h1>
    <p>Where Centre meets Excellence to create intelligent transformation. Our new website is on its way.</p>
    <a class="mail" href="mailto:info@cenofex.ai">info@cenofex.ai</a>
    <div class="meta">
      <span>Azerbaijan, Baku</span><span>·</span><span>&copy; 2026 CENOFEX</span>
    </div>
  </main>
</body>
</html>
